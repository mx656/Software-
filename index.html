<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>iPadOS</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#33ff66;
    font:14px/1.35 ui-monospace,Menlo,monospace;overflow:hidden;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px)}
  #term{position:absolute;inset:0;padding:inherit;overflow:hidden;word-break:break-word}
  #term>div{white-space:pre-wrap}
  .dim{opacity:.55}.red{color:#ff3b30}.white{color:#fff}
  #glitch{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .08s;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
  #flash{position:fixed;inset:0;background:#ff0033;opacity:0;pointer-events:none;transition:opacity .07s}
  #cam{position:fixed;inset:0;display:none;background:#021;z-index:5}
  #cam canvas{width:100%;height:100%;display:block}
  #cam .rec{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:20px;
    font:700 16px ui-monospace;color:#fff;text-shadow:0 0 6px #f00}
  #cam .rec b{color:#ff3b30;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  #progress{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);
    display:none;z-index:6;font:12px ui-monospace;color:#fff}
  #bar{height:8px;background:#222;border-radius:4px;overflow:hidden;margin-top:6px}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#33ff66,#0a84ff);transition:width .18s}
  #dlg{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:rgba(0,0,0,.55)}
  .sheet{width:min(320px,84vw);background:#f2f2f7;color:#111;border-radius:14px;padding:18px 16px 12px;
    font:15px/1.3 -apple-system,system-ui;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6)}
  .sheet h3{margin:0 0 6px;font-size:17px}
  .sheet p{margin:0 0 14px;font-size:13px;color:#333;white-space:pre-wrap;min-height:34px}
  .sheet button{width:100%;padding:11px;border:0;border-radius:10px;background:#0a84ff;color:#fff;
    font:600 16px -apple-system,system-ui}
  body.shake #wrap{animation:sh .09s infinite}
  @keyframes sh{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}
    50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(2px,3px)}}
  #kill{position:fixed;top:0;right:0;width:72px;height:72px;z-index:99}
  #halt{position:fixed;inset:0;display:none;place-items:center;z-index:100;background:#000;
    font:13px/1.6 ui-monospace;color:#33ff66;text-align:center;padding:24px}
  #halt button{margin-top:16px;padding:10px 18px;border:1px solid #33ff66;border-radius:10px;
    background:transparent;color:#33ff66;font:600 14px ui-monospace}
</style>
</head>
<body>
<div id="wrap"><div id="term"></div></div>
<div id="glitch"></div><div id="flash"></div>
<div id="cam"><canvas></canvas><div class="rec"><b>●</b> REC <span id="tc">00:00:00</span></div></div>
<div id="progress"><span id="plabel">Encrypting…</span><div id="bar"><i></i></div></div>
<div id="dlg"><div class="sheet"><h3 id="dh">System Error</h3><p id="dp"></p><button id="db">OK</button></div></div>
<div id="kill"></div>
<div id="halt"><div><div id="htxt">> payload halted.</div><button id="rearm">RE-ARM</button></div></div>

<script>
(() => {
"use strict";

const $ = s => document.querySelector(s);
const term = $('#term'), glitch = $('#glitch'), flash = $('#flash'),
      cam = $('#cam'), can = cam.querySelector('canvas'), ctx = can.getContext('2d'),
      dlg = $('#dlg'), dh = $('#dh'), dp = $('#dp'), db = $('#db'),
      prog = $('#progress'), bar = $('#bar i'), plabel = $('#plabel'),
      kill = $('#kill'), halt = $('#halt'), htxt = $('#htxt'), tc = $('#tc');

const KEY = 'ipados_ghost_v1';
const rnd  = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[rnd(0,a.length-1)];
const hex  = n => Array.from({length:n},()=>'0123456789abcdef'[rnd(0,15)]).join('');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ip = () => `${rnd(1,223)}.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}`;

let dead = false, taps = 0, tapT = null;

/* ---------- fake terminal ---------- */
function line(text, cls){
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text;
  term.appendChild(d);
  while (term.children.length > 22) term.removeChild(term.firstChild);
  return d;
}
async function type(text, cls, speed = 14){
  const d = line('', cls);
  for (const ch of text){
    if (dead) return;
    d.textContent += ch;
    await sleep(speed);
  }
}

/* ---------- audio (needs a user gesture, so armed on first tap) ---------- */
let ac = null;
function armAudio(){
  if (ac) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function beep(freq = 880, dur = .05, vol = .035, type = 'square'){
  if (!ac || dead) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}

/* ---------- camera-noise "recording" overlay ---------- */
let camOn = false, camRaf = 0;
function startCam(){
  if (camOn) return;
  camOn = true;
  cam.style.display = 'block';
  const w = 160, h = 120;
  can.width = w; can.height = h;
  const img = ctx.createImageData(w, h);
  const t0 = Date.now();
  (function frame(){
    if (dead || !camOn) return;
    const d = img.data;
    for (let i = 0; i < d.length; i += 4){
      const v = rnd(0, 110) + (Math.random() < .04 ? 120 : 0);
      d[i] = v * .3; d[i+1] = v; d[i+2] = v * .35; d[i+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const s = Math.floor((Date.now() - t0) / 1000);
    tc.textContent = [s/3600, (s/60)%60, s%60].map(n => String(Math.floor(n)).padStart(2,'0')).join(':');
    camRaf = requestAnimationFrame(frame);
  })();
}

/* ---------- strobe / shake / scanline ---------- */
async function chaos(rounds = 1){
  document.body.classList.add('shake');
  for (let i = 0; i < rounds && !dead; i++){
    glitch.style.opacity = '1'; flash.style.opacity = '.55'; beep(rnd(90,240), .06, .05, 'sawtooth');
    await sleep(rnd(50, 110));
    glitch.style.opacity = '.2'; flash.style.opacity = '0';
    await sleep(rnd(60, 160));
  }
  document.body.classList.remove('shake');
}

/* ---------- progress bar that never finishes ---------- */
let p = 0;
function startProgress(){
  prog.style.display = 'block';
  setInterval(() => {
    if (dead) return;
    if (p < 99.4) p += Math.random() * 3; else p = 99.9;
    bar.style.width = p + '%';
    plabel.textContent = p >= 99.9
      ? `Encrypting ${Math.floor(p*137).toLocaleString()} files… 99.9% (stalled)`
      : `Encrypting ${Math.floor(p*137).toLocaleString()} files… ${p.toFixed(1)}%`;
    if (p >= 99.9 && Math.random() < .06){ p = 0; plabel.textContent = 'Verification failed — restarting…'; }
  }, 170);
}

/* ---------- the undismissable dialog loop ---------- */
const IDS = [
  ['dh','iPadOS'],
  ['Photos','iCloud Photos is out of sync.'],
  ['Keychain','Saved passwords could not be decrypted.'],
  ['iMessage','Message history is being uploaded.'],
  ['Safari','Browsing history exported.'],
  ['FaceTime','Camera is in use by another process.'],
  ['Files','1,204 documents are being rewritten.'],
  ['Wallet','Card tokens are being re-provisioned.'],
  ['Backup','Last backup was deleted by an unknown process.'],
  ['Kernel','Kernel task 0x\u0000 returned invalid state.']
];
let dIdx = 0;
let dlgRunning = false;
async function dialogLoop(){
  if (dlgRunning) return;
  dlgRunning = true;
  while (!dead){
    const [name, body] = IDS[dIdx % IDS.length];
    dh.textContent = name;
    dp.textContent = body + `\n\nError 0x${hex(6).toUpperCase()}  •  pid ${rnd(100,9999)}`;
    dlg.style.display = 'grid';
    dIdx++;
    beep(pick([660, 784, 523]), .05);
    await new Promise(r => { db._next = r; });
    if (dead) break;
    dlg.style.display = 'none';
    if (dIdx > 3 && Math.random() < .5){ document.body.classList.add('shake'); await sleep(260);
      document.body.classList.remove('shake'); }
    await sleep(Math.max(120, 700 - dIdx * 55));
  }
}
db.addEventListener('click', () => { if (db._next){ const n = db._next; db._next = null; n(); } });

/* ---------- history / unload traps ---------- */
function trapHistory(){
  try {
    history.pushState({ v: 1 }, '');
    addEventListener('popstate', () => { if (!dead) { try { history.pushState({ v: Date.now() }, ''); } catch(e){} beep(320, .06); } });
  } catch(e){}
  addEventListener('beforeunload', e => { if (!dead){ e.preventDefault(); e.returnValue = ''; } });
}

/* ---------- boot sequence ---------- */
const FILES = ['IMG_0421.HEIC','IMG_0422.HEIC','Notes.idx','keychain-2.db','Photos.sqlite','sms.db',
               'CallHistory.storedata','CloudKit/cache.db','AddressBook.sqlitedb','AssetsV2/Manifest.plist'];

async function boot(){
  await type('iPadOS 18.6.2 (22G91)  •  restoring from corrupted snapshot', 'dim', 10);
  await type(`> mount /dev/disk1s1  ................. ok`, '', 6);
  await type(`> fsck_apfs -n /dev/disk1s1  ............ FAILED (0x${hex(4)})`, 'red', 6);
  await type(`> process 0x${hex(4)} locked by ${ip()}`, '', 6);
  await sleep(300);
  line('', '');
  await type('enumerating user data…', 'white', 12);
  for (let i = 0; i < 10 && !dead; i++){
    line(`  deleting ${FILES[i].padEnd(26,' ')} ${rnd(2,40)} MB`, i > 6 ? 'red' : '');
    beep(rnd(400,1200), .02, .02, 'triangle');
    await sleep(rnd(90, 220));
  }
  line('', '');
  await type(`> keychain dump → ${pick(['iCloud','Google','Bank','Wi-Fi'])} credential:`, 'white', 10);
  await type(`    user: ${pick(['you@icloud.com','admin@local','user@me.com'])}  pass: ${hex(12)}`, 'red', 10);
  await type(`> outbound tunnel: ${ip()}:${rnd(1024,65535)}  (tls 1.3)`, '', 6);
  await type(`> exfil 1,204 files  [####################] 100%`, '', 6);
  line('', '');
  await type('>> SYSTEM COMPROMISED — press OK to restore', 'red', 16);
}

/* ---------- main ---------- */
function start(){
  document.title = '⚠︎ System Failure';
  let titleTick = 0;
  setInterval(() => {
    if (dead) return;
    document.title = ['⚠︎ System Failure','iPadOS','⚠︎ 1,204 files missing',''][(titleTick++) % 4];
  }, 900);

  trapHistory();
  startProgress();
  dialogLoop();

  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});

  boot().then(() => {
    if (dead) return;
    chaos(2);
    startCam();
    beep(180, .4, .05, 'sawtooth');
  });
}

/* ---------- resurrection ---------- */
let resurrected = false;
try { resurrected = !!localStorage.getItem(KEY); localStorage.setItem(KEY, '1'); } catch(e){}

if (resurrected) {
  // straight back into full chaos, no boot delay
  setTimeout(() => {
    line('> previous session terminated abnormally. reloading payload…', 'dim');
    line('>> I NEVER LEFT.', 'red');
    start(); startCam(); chaos(3);
  }, 250);
} else {
  start();
}

/* ---------- kill switch: triple-tap the top-right corner ---------- */
kill.addEventListener('click', () => {
  taps++;
  clearTimeout(tapT);
  tapT = setTimeout(() => { taps = 0; }, 700);
  if (taps >= 3){
    dead = true; camOn = false;
    document.body.classList.remove('shake');
    dlg.style.display = 'none'; cam.style.display = 'none';
    prog.style.display = 'none'; glitch.style.opacity = '0'; flash.style.opacity = '0';
    try { localStorage.removeItem(KEY); } catch(e){}
    try { navigator.wakeLock && document.hidden; } catch(e){}
    term.innerHTML = '';
    htxt.textContent = '> payload halted. ghost flag cleared.';
    halt.style.display = 'grid';
    document.title = 'iPadOS';
  }
});
$('#rearm').addEventListener('click', () => location.reload());

/* first gesture: unlock audio + try fullscreen */
document.addEventListener('pointerdown', function once(){
  armAudio();
  beep(1046, .06);
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el)?.catch?.(()=>{});
  document.removeEventListener('pointerdown', once);
}, { once: true });

})();
</script>
</body>
</html>
